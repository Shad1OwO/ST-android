name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # The Node.js compile takes hours, so the finished binary is cached. The key changes whenever
      # the node submodule commit, the patches, the Node build scripts or the build image change.
      - name: Compute Node.js cache key
        id: nodekey
        run: echo "node_sha=$(git rev-parse HEAD:node)" >> "$GITHUB_OUTPUT"

      - name: Restore cached Node.js binary
        id: nodecache
        uses: actions/cache/restore@v4
        with:
          path: out/android/arm64/node
          key: node-arm64-${{ steps.nodekey.outputs.node_sha }}-${{ hashFiles('tools/patches/*.patch', 'tools/node/scripts/*.sh', 'ci/docker/Dockerfile') }}

      - name: Build APK (Docker)
        run: bash ci/scripts/build_apk_docker.sh
        env:
          SKIP_NODE_BUILD: ${{ steps.nodecache.outputs.cache-hit == 'true' && '1' || '' }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # Runs even if a later part of the build failed, so a finished Node.js compile is never thrown away.
      - name: Save Node.js binary to cache
        if: always() && steps.nodecache.outputs.cache-hit != 'true' && hashFiles('out/android/arm64/node') != ''
        uses: actions/cache/save@v4
        with:
          path: out/android/arm64/node
          key: ${{ steps.nodecache.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: |
            out/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        id: release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: ST-android ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: ${{ contains(github.ref_name, '-') }}

      - name: Publish pre-release after asset upload
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease
